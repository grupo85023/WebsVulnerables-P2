# Hardening de Apache (laboratorio WebsVulnerables)
# No anunciar versión ni sistema operativo
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Sin listados de directorios
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Ficheros que no deben servirse aunque estén en el directorio web
<FilesMatch "\.(bak|old|orig|swp|sql|md|log|ini)$">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header unset X-Powered-By
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # CSP: 'unsafe-inline' es necesario porque las páginas llevan JavaScript y estilos en línea
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    # Añade HttpOnly y SameSite a las cookies que la aplicación crea sin ellos
    Header edit Set-Cookie "^((?!.*[Hh]ttp[Oo]nly).*)$" "$1; HttpOnly"
    Header edit Set-Cookie "^((?!.*[Ss]ame[Ss]ite).*)$" "$1; SameSite=Lax"
</IfModule>
