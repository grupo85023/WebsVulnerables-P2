; Hardening de PHP (laboratorio WebsVulnerables)
; No anunciar la versión de PHP (cabecera X-Powered-By)
expose_php = Off
; Los errores van al log, nunca a la página (evita revelar rutas y consultas)
display_errors = Off
display_startup_errors = Off
log_errors = On
; Impide include() de URLs remotas
allow_url_include = Off
; Cookies de sesión seguras por defecto en todos los sitios
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
